[pytest]
testpaths = tests
pythonpath = .
markers =
    slow: loads a real embedding model (downloads ~1-2 GB the first time). Run with: pytest -m slow
    db: needs DATABASE_URL and the schema from M4. Run with: pytest -m db
# Fast unit tests by default. A -m on the command line replaces this filter.
addopts = -m "not slow and not db"
